<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administração - Fisioterapia GRECAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { brand: { navy: '#0B1953', blue: '#1E40AF', lightBlue: '#3B82F6', orange: '#FF5722', orangeHover: '#F4511E' } },
            fontFamily: { sans: ['Inter', 'sans-serif'] }
        } } }
    </script>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen pb-12">
    <header class="bg-brand-navy border-b border-slate-800 text-white shadow-xl">
        <div class="max-w-3xl mx-auto px-4 py-4">
            <h1 class="font-extrabold text-lg leading-none">ADMINISTRAÇÃO</h1>
            <span class="text-xs text-brand-lightBlue font-semibold uppercase tracking-wider">Fisioterapia GRECAS · acesso reservado</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6 space-y-4">
        <section class="bg-white rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="grid sm:grid-cols-2 gap-3">
                <div>
                    <label for="pw" class="block text-xs font-semibold text-slate-600 mb-1">Palavra-passe</label>
                    <input id="pw" type="password" autocomplete="current-password" class="w-full rounded-xl border border-slate-300 p-3 text-sm focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
                <div>
                    <label for="day" class="block text-xs font-semibold text-slate-600 mb-1">Quarta-feira</label>
                    <select id="day" class="w-full rounded-xl border border-slate-300 p-3 text-sm bg-white focus:ring-2 focus:ring-brand-blue focus:outline-none"></select>
                </div>
            </div>
            <button id="load" class="w-full bg-brand-navy hover:bg-brand-blue text-white font-semibold py-3 rounded-2xl transition">Ver marcações deste dia</button>
            <p id="err" class="hidden text-sm font-medium text-red-700 bg-red-50 border border-red-200 rounded-2xl p-3"></p>
        </section>

        <section id="result" class="hidden bg-white rounded-3xl p-6 shadow-2xl space-y-5">
            <div>
                <h2 id="title" class="text-lg font-extrabold text-brand-navy"></h2>
                <p id="notes" class="text-xs text-amber-700 mt-1"></p>
            </div>
            <div id="list" class="divide-y divide-slate-200 text-sm"></div>

            <div id="notify" class="space-y-3 border-t border-slate-200 pt-5">
                <h3 class="font-bold text-brand-navy">Avisar todos os atletas deste dia</h3>
                <textarea id="msg" rows="6" class="w-full rounded-2xl border border-slate-300 p-3 text-sm focus:ring-2 focus:ring-brand-blue focus:outline-none"></textarea>
                <div class="flex flex-col sm:flex-row gap-2">
                    <a id="mailBtn" class="flex-1 text-center bg-brand-orange hover:bg-brand-orangeHover text-white font-bold py-3 rounded-2xl transition cursor-pointer">Abrir email (todos em BCC)</a>
                    <button id="copyMails" type="button" class="flex-1 border border-slate-300 text-slate-700 font-semibold py-3 rounded-2xl hover:bg-slate-50 transition">Copiar emails</button>
                    <button id="copyPhones" type="button" class="flex-1 border border-slate-300 text-slate-700 font-semibold py-3 rounded-2xl hover:bg-slate-50 transition">Copiar telemóveis</button>
                </div>
                <p class="text-xs text-slate-500">O email abre na tua aplicação de email, já com todos os atletas em BCC (não veem os contactos uns dos outros). Podes alterar o texto antes de enviar.</p>
            </div>
        </section>
    </main>

    <script>
        const ADMIN_EMAIL = 'bsb.rehab@gmail.com';
        const $ = (id) => document.getElementById(id);
        const pad = (n) => String(n).padStart(2, '0');
        const label = (iso) => iso.split('-').reverse().join('/');
        let bookings = [], currentDate = '';

        // Próximas 5 quartas-feiras (inclui hoje se for quarta)
        (function fillDays() {
            const d = new Date(); d.setHours(12, 0, 0, 0);
            while (d.getDay() !== 3) d.setDate(d.getDate() + 1);
            for (let i = 0; i < 5; i++) {
                const iso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
                const o = document.createElement('option'); o.value = iso; o.textContent = label(iso);
                $('day').appendChild(o);
                d.setDate(d.getDate() + 7);
            }
            try { $('pw').value = sessionStorage.getItem('adm') || ''; } catch (e) {}
        })();

        function showErr(t) { const e = $('err'); e.textContent = t; e.classList.remove('hidden'); }

        function defaultMessage(date) {
            return `Olá!\n\nInformamos que na quarta-feira, ${label(date)}, não haverá atendimento de fisioterapia.\n\n` +
                `Se tinhas marcação, podes reagendar através do link do email de confirmação ou contactar-nos.\n\n` +
                `Obrigado pela compreensão.\nFisioterapia GRECAS`;
        }

        function updateMail() {
            const emails = [...new Set(bookings.map(b => b.email).filter(Boolean))];
            const subject = `Fisioterapia GRECAS – aviso para ${label(currentDate)}`;
            $('mailBtn').href = `mailto:${ADMIN_EMAIL}?bcc=${encodeURIComponent(emails.join(','))}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent($('msg').value)}`;
        }
        $('msg').addEventListener('input', updateMail);

        const copy = async (text, btn) => {
            try { await navigator.clipboard.writeText(text); const o = btn.textContent; btn.textContent = 'Copiado ✓'; setTimeout(() => btn.textContent = o, 1500); }
            catch (e) { prompt('Copia manualmente:', text); }
        };
        $('copyMails').onclick = (ev) => copy([...new Set(bookings.map(b => b.email).filter(Boolean))].join(', '), ev.target);
        $('copyPhones').onclick = (ev) => copy(bookings.map(b => b.phone).filter(Boolean).join(', '), ev.target);

        $('load').onclick = async () => {
            $('err').classList.add('hidden');
            const pw = $('pw').value;
            if (!pw) return showErr('Escreve a palavra-passe.');
            $('load').disabled = true; $('load').textContent = 'A carregar…';
            try {
                const date = $('day').value;
                const r = await fetch(`/api/admin?date=${date}`, { headers: { Authorization: 'Bearer ' + pw }, cache: 'no-store' });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) return showErr(data.error || 'Erro ao carregar.');
                try { sessionStorage.setItem('adm', pw); } catch (e) {}
                bookings = data.bookings; currentDate = data.date;
                $('title').textContent = `${label(data.date)} · ${bookings.length} marcação(ões)`;
                $('notes').textContent = data.dayNotes.length ? 'Eventos de dia inteiro: ' + data.dayNotes.join(' | ') : '';
                const list = $('list'); list.innerHTML = '';
                if (!bookings.length) list.innerHTML = '<p class="py-3 text-slate-500">Sem marcações neste dia.</p>';
                for (const b of bookings) {
                    const row = document.createElement('div'); row.className = 'py-3 flex gap-3';
                    const t = document.createElement('div'); t.className = 'font-bold text-brand-orange w-14 shrink-0'; t.textContent = b.time;
                    const info = document.createElement('div');
                    const n = document.createElement('div'); n.className = 'font-semibold'; n.textContent = b.name;
                    const c = document.createElement('div'); c.className = 'text-xs text-slate-500 break-all';
                    c.textContent = `${b.phone} · ${b.email}${b.modality && b.modality !== 'Não especificado' ? ' · ' + b.modality : ''}`;
                    info.append(n, c); row.append(t, info); list.appendChild(row);
                }
                $('msg').value = defaultMessage(data.date);
                $('notify').classList.toggle('hidden', !bookings.length);
                updateMail();
                $('result').classList.remove('hidden');
            } catch (e) {
                showErr('Sem ligação ao servidor.');
            } finally {
                $('load').disabled = false; $('load').textContent = 'Ver marcações deste dia';
            }
        };
    </script>
</body>
</html>
